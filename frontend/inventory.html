<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetailMart - Inventory</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="layout">

        <aside class="sidebar">
            <h2>🛒 RetailMart</h2>

            <a href="index.html">Dashboard</a>
            <a href="products.html">Products</a>
            <a href="customers.html">Customers</a>
            <a href="inventory.html">Inventory</a>
            <a href="orders.html">Orders</a>
            <a href="reports.html">Reports</a>
        </aside>

        <main class="container">

            <h1>🛒 RetailMart</h1>
            <h2>Inventory</h2>

            <div class="cards">

                <div class="card">
                    <h3>Total Items</h3>
                    <p id="totalItems">0</p>
                </div>

                <div class="card">
                    <h3>In Stock</h3>
                    <p id="inStock">0</p>
                </div>

                <div class="card">
                    <h3>Low Stock</h3>
                    <p id="lowStock">0</p>
                </div>

                <div class="card">
                    <h3>Out of Stock</h3>
                    <p id="outOfStock">0</p>
                </div>

            </div>

            <h2>Inventory</h2>

            <table>
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Store</th>
                        <th>Quantity</th>
                        <th>Reorder Level</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="inventoryTable">
                </tbody>
            </table>

        </main>

    </div>

    <script src="js/inventory.js"></script>

</body>
</html>
