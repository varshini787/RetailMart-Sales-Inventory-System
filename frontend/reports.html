<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetailMart - Reports</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="layout">

        <aside class="sidebar">
            <h2>🛒 RetailMart</h2>

            <a href="index.html">Dashboard</a>
            <a href="products.html">Products</a>
            <a href="customers.html">Customers</a>
            <a href="inventory.html">Inventory</a>
            <a href="orders.html">Orders</a>
            <a href="reports.html">Reports</a>
        </aside>

        <main class="container">

            <h1>🛒 RetailMart</h1>
            <h2>Reports</h2>

            <div class="cards">

                <div class="card">
                    <h3>Monthly Revenue</h3>
                    <p id="monthlyRevenue">₹0</p>
                </div>

                <div class="card">
                    <h3>Sales by Category</h3>
                    <p id="categorySales">0</p>
                </div>

                <div class="card">
                    <h3>Top Products</h3>
                    <p id="topProducts">0</p>
                </div>

                <div class="card">
                    <h3>Top Customers</h3>
                    <p id="topCustomers">0</p>
                </div>

            </div>

            <h2>Store Performance</h2>

            <table>
                <thead>
                    <tr>
                        <th>Store</th>
                        <th>Total Orders</th>
                        <th>Total Revenue</th>
                    </tr>
                </thead>

                <tbody id="storeTable">
                </tbody>
            </table>

        </main>

    </div>

    <script src="js/reports.js"></script>

</body>
</html>
